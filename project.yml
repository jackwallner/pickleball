name: DuprIQ
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.72.0
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  lastUpgradeCheck: "1600"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  DuprIQ:
    type: application
    platform: iOS
    sources:
      - path: DuprIQ
        excludes:
          - DuprIQ.storekit
      - path: Shared
      - path: DuprIQ/DuprIQ.storekit
        buildPhase: resources
    settings:
      base:
        DEVELOPMENT_TEAM: YXG4MP6W39
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.pickleball
        PRODUCT_NAME: DuprIQ
        PRODUCT_MODULE_NAME: DuprIQ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DuprIQ/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: RevenueCat

  DuprIQTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DuprIQTests
    dependencies:
      - target: DuprIQ
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DuprIQ.app/DuprIQ"

  # App Store screenshot capture. Deliberately NOT in the DuprIQ scheme's test
  # action: it drives the real UI and takes a minute, and the unit-test loop
  # should stay instant. Drive it with scripts/capture-screenshots.sh.
  DuprIQScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DuprIQScreenshots
    dependencies:
      - target: DuprIQ
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DuprIQ

schemes:
  DuprIQ:
    build:
      targets:
        DuprIQ: all
    run:
      config: Debug
      storeKitConfiguration: DuprIQ/DuprIQ.storekit
    test:
      config: Debug
      targets:
        - DuprIQTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Screenshots:
    build:
      targets:
        DuprIQ: all
        DuprIQScreenshots: [test]
    test:
      config: Debug
      testPlans:
        - path: DuprIQScreenshots/Screenshots.xctestplan
      targets:
        - DuprIQScreenshots
